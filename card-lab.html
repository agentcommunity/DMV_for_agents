<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Lab · DMV</title>
  <style>
    @font-face {
      font-family: 'PPSupplyMono';
      src: url('fonts/PPSupplyMono-Regular.otf') format('opentype');
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0e0e0e;
      color: #999;
      font-family: 'PPSupplyMono', 'SF Mono', 'Fira Code', monospace;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 40px 20px 20px;
      border-bottom: 1px solid #1a1a1a;
    }
    header h1 { font-size: 24px; color: #fff; letter-spacing: 8px; }
    header p { font-size: 11px; color: #444; margin-top: 8px; }

    .preview {
      display: flex;
      gap: 40px;
      max-width: 950px;
      margin: 40px auto;
      padding: 0 20px;
      align-items: flex-start;
    }
    .card-wrap {
      flex-shrink: 0;
      perspective: 800px;
      position: relative;
    }
    .card-wrap::after {
      content: '';
      position: absolute;
      inset: -80px;
      background: radial-gradient(circle, var(--card-glow, rgba(51,255,136,0.1)), transparent 70%);
      pointer-events: none;
      z-index: -1;
    }

    .card {
      width: 315px;
      height: 440px;
      position: relative;
      transform-style: preserve-3d;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      will-change: transform;
      background: #050505;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 1px rgba(255,255,255,0.1);
      touch-action: none; /* enable touch tilt on mobile */
      -webkit-user-select: none;
      user-select: none;
    }
    .card canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* ── Holo Overlays — light-reactive (pokemon-cards-css style) ── */
    .card {
      --mx: 50%;
      --my: 50%;
      --angle: 130deg;
      --card-opacity: 0;
      --pointer-from-center: 0;
      --pointer-from-left: 0.5;
      --pointer-from-top: 0.5;
      --bg-x: 50%;
      --bg-y: 50%;
    }

    .card-shine, .card-glare, .card-foil, .card-sparkle {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      z-index: 2;
    }

    /* ── SHINE: rainbow holo, only visible when light hits ── */
    .card-shine {
      background-image:
        /* Rainbow spectrum, oversized for parallax shift */
        repeating-linear-gradient(
          var(--angle, 130deg),
          hsla(0,90%,60%,.4), hsla(50,90%,55%,.3),
          hsla(100,90%,55%,.4), hsla(150,90%,55%,.3),
          hsla(200,90%,60%,.4), hsla(250,90%,55%,.3),
          hsla(300,90%,55%,.4), hsla(340,90%,55%,.3),
          hsla(360,90%,60%,.4)
        ),
        /* Scanline texture for foil grain */
        repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 1px,
          transparent 1px, transparent 3px
        );
      background-size: 400% 400%, cover;
      /* Parallax: bg position shifts with pointer */
      background-position:
        calc(((50% - var(--bg-x)) * 2.6) + 50%) calc(((50% - var(--bg-y)) * 3.5) + 50%),
        center center;
      background-blend-mode: overlay;
      mix-blend-mode: color-dodge;
      filter: brightness(calc((var(--pointer-from-center) * 0.5) + 0.4))
              contrast(2.5) saturate(0.7);
      opacity: var(--card-opacity);
      transition: opacity 0.4s ease;
    }
    /* Shine after: radial spotlight from pointer position */
    .card-shine::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(
        farthest-corner circle at var(--mx) var(--my),
        hsla(0, 0%, 100%, 0.3) 5%,
        hsla(0, 0%, 100%, 0.1) 25%,
        transparent 60%
      );
      mix-blend-mode: overlay;
      opacity: var(--card-opacity);
    }

    /* ── Prism: conic rainbow centered on pointer ── */
    .holo-prism .card-shine {
      background-image:
        conic-gradient(
          from var(--angle, 0deg) at var(--mx, 50%) var(--my, 50%),
          hsla(0,90%,55%,.5), hsla(60,90%,55%,.35),
          hsla(120,90%,55%,.5), hsla(180,90%,55%,.35),
          hsla(240,90%,55%,.5), hsla(300,90%,55%,.35),
          hsla(360,90%,55%,.5)
        ),
        repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px,
          transparent 1px, transparent 3px
        );
      background-size: cover, cover;
      background-position: center, center;
    }

    /* ── Aurora: horizontal color bands ── */
    .holo-aurora .card-shine {
      background-image:
        linear-gradient(
          calc(170deg + var(--angle, 0deg) * 0.15),
          hsla(120,80%,45%,.45) 0%, hsla(160,85%,50%,.3) 20%,
          hsla(190,90%,55%,.35) 40%, transparent 55%,
          hsla(260,75%,50%,.3) 70%, hsla(290,70%,45%,.25) 85%,
          transparent 100%
        ),
        repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px,
          transparent 1px, transparent 4px
        );
      background-size: 300% 300%, cover;
      background-position:
        calc(((50% - var(--bg-x)) * 1.8) + 50%) calc(((50% - var(--bg-y)) * 2.0) + 50%),
        center center;
    }

    /* ── Duochrome: two-color shift ── */
    .holo-duochrome .card-shine {
      background-image:
        linear-gradient(
          var(--angle, 130deg),
          var(--duo-1, hsla(320,80%,50%,.5)) 0%,
          transparent 25%, transparent 75%,
          var(--duo-2, hsla(180,80%,50%,.5)) 100%
        ),
        repeating-linear-gradient(
          calc(var(--angle, 0deg) + 45deg),
          transparent 0px, transparent 2px,
          rgba(255,255,255,0.05) 2px, rgba(255,255,255,0.05) 3px
        );
      background-size: 300% 300%, cover;
      background-position:
        calc(((50% - var(--bg-x)) * 3.0) + 50%) calc(((50% - var(--bg-y)) * 3.0) + 50%),
        center center;
    }

    /* ── GLARE: white spotlight following pointer (the "light source") ── */
    .card-glare {
      background: radial-gradient(
        farthest-corner circle at var(--mx, 50%) var(--my, 50%),
        hsla(0, 0%, 100%, 0.7) 5%,
        hsla(0, 0%, 100%, 0.5) 15%,
        hsla(0, 0%, 100%, 0.1) 35%,
        hsla(0, 0%, 0%, 0.3) 80%
      );
      mix-blend-mode: overlay;
      /* Opacity = interaction state * (base + distance factor) */
      opacity: calc(var(--card-opacity) * (0.25 + var(--pointer-from-center) * 0.6));
      transition: opacity 0.35s ease;
    }

    /* ── FOIL: fine holographic lines ── */
    .card-foil {
      background:
        repeating-linear-gradient(
          calc(var(--angle, 0deg) + 90deg),
          transparent 0px, transparent 2px,
          rgba(255,255,255,0.06) 2px, rgba(255,255,255,0.06) 3px
        ),
        repeating-linear-gradient(
          calc(var(--angle, 0deg)),
          transparent 0px, transparent 4px,
          rgba(255,255,255,0.02) 4px, rgba(255,255,255,0.02) 5px
        );
      mix-blend-mode: overlay;
      opacity: calc(var(--card-opacity) * 0.8);
      transition: opacity 0.4s ease;
    }

    /* ── SPARKLE: animated noise overlay for legendary ── */
    .card-sparkle {
      background-image: radial-gradient(
        circle at var(--mx, 50%) var(--my, 50%),
        hsla(0, 0%, 100%, 0.15) 0%,
        transparent 50%
      );
      mix-blend-mode: color-dodge;
      opacity: calc(var(--card-opacity) * var(--pointer-from-center) * var(--holo-intensity, 0.5));
      transition: opacity 0.3s ease;
    }

    /* ── Controls ── */
    .controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 0;
    }
    .ctrl-group {
      background: #151515;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .ctrl-group label {
      display: block;
      font-size: 9px;
      color: #555;
      letter-spacing: 3px;
      margin-bottom: 6px;
    }
    .input-row { display: flex; gap: 6px; }
    .input-row input {
      flex: 1;
      background: #0a0a0a;
      border: 1px solid #333;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 4px;
      outline: none;
    }
    .input-row input:focus { border-color: #555; }
    .btn-icon {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      font-size: 16px;
      width: 34px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-icon:hover { background: #252525; color: #fff; }
    .pal-grid { display: flex; gap: 6px; flex-wrap: wrap; }
    .pal-btn {
      width: 28px; height: 28px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
    }
    .pal-btn:hover { transform: scale(1.15); }
    .pal-btn.active { border-color: #fff; transform: scale(1.15); }
    .opt-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .opt-btn {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      color: #777;
      font-family: inherit;
      font-size: 10px;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .opt-btn:hover { background: #252525; color: #ccc; }
    .opt-btn.active { background: #222; border-color: #555; color: #fff; }
    .btn-randomize {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      font-family: inherit;
      font-size: 12px;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      letter-spacing: 2px;
      transition: all 0.15s;
    }
    .btn-randomize:hover { background: #252525; color: #fff; border-color: #555; }
    .dna-readout {
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 10px;
      color: #555;
      line-height: 1.8;
    }
    .dna-readout span { color: #888; }

    /* ── Gallery ── */
    .gallery {
      max-width: 1100px;
      margin: 60px auto;
      padding: 0 20px 60px;
    }
    .gallery h2 { font-size: 14px; color: #fff; letter-spacing: 6px; text-align: center; }
    .gallery-sub { font-size: 10px; color: #444; text-align: center; margin: 8px 0 30px; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 24px;
      justify-items: center;
    }
    .gallery-item { perspective: 600px; cursor: pointer; position: relative; }
    .gallery-item::after {
      content: '';
      position: absolute;
      inset: -30px;
      background: radial-gradient(circle, var(--card-glow, rgba(51,255,136,0.06)), transparent 70%);
      pointer-events: none;
      z-index: -1;
      transition: opacity 0.3s;
      opacity: 0.5;
    }
    .gallery-item:hover::after { opacity: 1; }
    .gallery-card {
      width: 170px; height: 238px;
      transition: box-shadow 0.3s;
    }
    .gallery-card:hover {
      box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 20px var(--card-glow, rgba(51,255,136,0.12));
    }
    .gallery-label {
      font-size: 9px; color: #555; text-align: center;
      margin-top: 8px; letter-spacing: 1px; transition: color 0.3s;
    }
    .gallery-item:hover .gallery-label { color: #888; }
    @keyframes cardFlip {
      0% { transform: rotateY(0); }
      50% { transform: rotateY(90deg) scale(0.95); }
      100% { transform: rotateY(0); }
    }
    .card.flipping { animation: cardFlip 0.5s ease-in-out; }
    @media (max-width: 720px) {
      .preview { flex-direction: column; align-items: center; }
      .controls { width: 100%; max-width: 400px; }
    }
  </style>
</head>
<body>

<header>
  <h1>CARD LAB</h1>
  <p>Procedural Card Generator &middot; Department of Machine Verification</p>
</header>

<main>
  <section class="preview">
    <div class="card-wrap">
      <div class="card" id="mainCard">
        <canvas id="mainCanvas" width="630" height="880"></canvas>
        <div class="card-shine"></div>
        <div class="card-glare"></div>
        <div class="card-foil"></div>
        <div class="card-sparkle"></div>
      </div>
    </div>
    <div class="controls">
      <div class="ctrl-group">
        <label>AGENT NAME</label>
        <div class="input-row">
          <input type="text" id="nameInput" value="nexus-7" spellcheck="false">
          <button class="btn-icon" id="btnRandName" title="Random name">&#x27F3;</button>
        </div>
      </div>
      <div class="ctrl-group">
        <label>PALETTE</label>
        <div class="pal-grid" id="palSel"></div>
      </div>
      <div class="ctrl-group">
        <label>BORDER</label>
        <div class="opt-row" id="borderSel"></div>
      </div>
      <div class="ctrl-group">
        <label>PATTERN</label>
        <div class="opt-row" id="patternSel"></div>
      </div>
      <div class="ctrl-group">
        <label>HOLO EFFECT</label>
        <div class="opt-row" id="holoSel"></div>
      </div>
      <div class="ctrl-group">
        <label>RARITY</label>
        <div class="opt-row" id="raritySel"></div>
      </div>
      <button class="btn-randomize" id="btnRandomize">&#x27F3; RANDOMIZE ALL</button>
      <div class="dna-readout" id="dnaReadout"></div>
    </div>
  </section>

  <section class="gallery">
    <h2>GALLERY</h2>
    <p class="gallery-sub">Each agent gets unique traits. Click to preview.</p>
    <div class="gallery-grid" id="galleryGrid"></div>
  </section>
</main>

<script>
// ═══════════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════════
const CW = 630, CH = 880, PAD = 24;

// ═══════════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════════
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193);
  }
  return h >>> 0;
}

function seededRand(seed) {
  let s = seed;
  return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
}

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function withAlpha(hex, a) {
  const [r,g,b] = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function generateCertId(name) {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const rand = seededRand(fnv1a(name + ':cert'));
  const pick = () => chars[(rand() * chars.length) | 0];
  return `${pick()}${pick()}${pick()}${pick()}-${pick()}${pick()}${pick()}-${pick()}${pick()}${pick()}${pick()}`;
}

// ═══════════════════════════════════════════════════════════════
//  DRAWING HELPERS
// ═══════════════════════════════════════════════════════════════
function drawCorners(ctx, x, y, w, h, color, size) {
  const L = size || 25, T = 2;
  ctx.fillStyle = color;
  ctx.fillRect(x, y, L, T);           ctx.fillRect(x, y, T, L);
  ctx.fillRect(x+w-L, y, L, T);       ctx.fillRect(x+w-T, y, T, L);
  ctx.fillRect(x, y+h-T, L, T);       ctx.fillRect(x, y+h-L, T, L);
  ctx.fillRect(x+w-L, y+h-T, L, T);   ctx.fillRect(x+w-T, y+h-L, T, L);
}

function drawIdenticon(ctx, x, y, size, seed, color1, color2) {
  const rand = seededRand(seed);
  const grid = 9, cell = size / grid, half = Math.ceil(grid / 2);
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(x, y, size, size);
  const cells = [];
  for (let gy = 0; gy < half; gy++) {
    cells[gy] = [];
    for (let gx = 0; gx < half; gx++) cells[gy][gx] = rand() > 0.42;
  }
  // Dual-color gradient identicon
  for (let gy = 0; gy < grid; gy++) {
    for (let gx = 0; gx < grid; gx++) {
      const sy = gy < half ? gy : grid-1-gy;
      const sx = gx < half ? gx : grid-1-gx;
      if (cells[sy]?.[sx]) {
        const t = gy / grid;
        const [r1,g1,b1] = hexToRgb(color1);
        const [r2,g2,b2] = hexToRgb(color2);
        const r = r1 + (r2-r1)*t, g = g1 + (g2-g1)*t, b = b1 + (b2-b1)*t;
        ctx.fillStyle = `rgba(${r|0},${g|0},${b|0},0.9)`;
        ctx.fillRect(x+gx*cell+1, y+gy*cell+1, cell-2, cell-2);
      }
    }
  }
}

function drawQR(ctx, x, y, size, seed, color) {
  const n = 21, c = size / n, rand = seededRand(seed);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(x-2, y-2, size+4, size+4);
  const dot = (mx, my) => ctx.fillRect(x+mx*c, y+my*c, c, c);
  const finder = (fx, fy) => {
    ctx.fillStyle = color;
    for (let i = 0; i < 7; i++) { dot(fx+i,fy); dot(fx+i,fy+6); dot(fx,fy+i); dot(fx+6,fy+i); }
    for (let i = 2; i < 5; i++) for (let j = 2; j < 5; j++) dot(fx+i, fy+j);
  };
  finder(0,0); finder(n-7,0); finder(0,n-7);
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.65;
  for (let my = 0; my < n; my++)
    for (let mx = 0; mx < n; mx++) {
      if ((mx<8&&my<8)||(mx>=n-7&&my<8)||(mx<8&&my>=n-7)) continue;
      if (mx===6||my===6) continue;
      if (rand() > 0.5) dot(mx, my);
    }
  ctx.globalAlpha = 1;
}

function drawStarField(ctx, w, h, seed, color1, color2, count) {
  const rand = seededRand(seed);
  for (let i = 0; i < count; i++) {
    const x = rand() * w, y = rand() * h;
    const size = 0.3 + rand() * 1.5;
    const alpha = 0.08 + rand() * 0.35;
    const c = rand() > 0.5 ? color1 : color2;
    ctx.fillStyle = c;
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
    // Bright stars get a glow halo
    if (rand() > 0.88) {
      ctx.globalAlpha = alpha * 0.2;
      ctx.beginPath();
      ctx.arc(x, y, size * 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawConstellation(ctx, x, y, w, h, seed, color) {
  const rand = seededRand(seed);
  const pts = [];
  const n = 7 + (rand() * 6) | 0;
  for (let i = 0; i < n; i++) {
    pts.push({ x: x + rand() * w, y: y + rand() * h });
  }
  // Connect nearby points
  ctx.strokeStyle = color;
  ctx.lineWidth = 0.6;
  ctx.globalAlpha = 0.12;
  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
      if (Math.sqrt(dx*dx + dy*dy) < Math.min(w, h) * 0.45) {
        ctx.beginPath();
        ctx.moveTo(pts[i].x, pts[i].y);
        ctx.lineTo(pts[j].x, pts[j].y);
        ctx.stroke();
      }
    }
  }
  // Star dots
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.5;
  for (const p of pts) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.5 + rand(), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawChip(ctx, x, y, w, h, color1, color2) {
  // Chip body
  const grad = ctx.createLinearGradient(x, y, x + w, y + h);
  grad.addColorStop(0, withAlpha(color1, 0.2));
  grad.addColorStop(1, withAlpha(color2, 0.1));
  roundRect(ctx, x, y, w, h, 4);
  ctx.fillStyle = grad;
  ctx.fill();
  // Chip border
  ctx.strokeStyle = withAlpha(color1, 0.5);
  ctx.lineWidth = 1;
  roundRect(ctx, x, y, w, h, 4);
  ctx.stroke();
  // Internal lines
  ctx.strokeStyle = withAlpha(color1, 0.25);
  ctx.lineWidth = 0.5;
  const mx = x + w/2, my = y + h/2;
  ctx.beginPath(); ctx.moveTo(x + 4, my); ctx.lineTo(x + w - 4, my); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx, y + 4); ctx.lineTo(mx, y + h - 4); ctx.stroke();
  // Contact pads
  ctx.fillStyle = withAlpha(color1, 0.15);
  ctx.fillRect(x + 3, y + 3, w/2 - 5, h/2 - 5);
  ctx.fillRect(mx + 2, my + 2, w/2 - 5, h/2 - 5);
}

function drawBarcode(ctx, x, y, w, h, seed, color) {
  const rand = seededRand(seed);
  ctx.fillStyle = color;
  let cx = x;
  while (cx < x + w) {
    const barW = 1 + (rand() * 2.5) | 0;
    const gap = 1 + (rand() * 2) | 0;
    ctx.globalAlpha = 0.3 + rand() * 0.5;
    ctx.fillRect(cx, y, barW, h);
    cx += barW + gap;
  }
  ctx.globalAlpha = 1;
}

function drawSecurityStrip(ctx, w, h, pal) {
  ctx.save();
  ctx.translate(w * 0.75, 0);
  ctx.rotate(Math.PI / 4);
  const grad = ctx.createLinearGradient(0, -40, 0, 40);
  grad.addColorStop(0, withAlpha(pal.pri, 0.03));
  grad.addColorStop(0.2, withAlpha(pal.acc, 0.06));
  grad.addColorStop(0.4, withAlpha(pal.acc2, 0.04));
  grad.addColorStop(0.6, withAlpha(pal.pri, 0.06));
  grad.addColorStop(0.8, withAlpha(pal.acc2, 0.03));
  grad.addColorStop(1, withAlpha(pal.acc, 0.05));
  ctx.fillStyle = grad;
  ctx.fillRect(-w, -14, w * 3, 28);
  // Thin bright edge lines
  ctx.fillStyle = withAlpha(pal.acc, 0.08);
  ctx.fillRect(-w, -14, w * 3, 1);
  ctx.fillRect(-w, 13, w * 3, 1);
  ctx.restore();
}

function drawMicroText(ctx, x, y, w, text, color) {
  ctx.font = '5px monospace';
  ctx.fillStyle = color;
  ctx.globalAlpha = 0.1;
  ctx.textAlign = 'left';
  let cx = x;
  const tw = ctx.measureText(text + '   ').width;
  while (cx < x + w) {
    ctx.fillText(text, cx, y);
    cx += tw;
  }
  ctx.globalAlpha = 1;
}

function drawGradientDivider(ctx, x, y, w, color1, color2) {
  const grad = ctx.createLinearGradient(x, 0, x + w, 0);
  grad.addColorStop(0, 'transparent');
  grad.addColorStop(0.15, withAlpha(color1, 0.6));
  grad.addColorStop(0.5, withAlpha(color2, 0.9));
  grad.addColorStop(0.85, withAlpha(color1, 0.6));
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.fillRect(x, y, w, 1);
  // Subtle second line
  const grad2 = ctx.createLinearGradient(x, 0, x + w, 0);
  grad2.addColorStop(0, 'transparent');
  grad2.addColorStop(0.3, withAlpha(color1, 0.2));
  grad2.addColorStop(0.7, withAlpha(color1, 0.2));
  grad2.addColorStop(1, 'transparent');
  ctx.fillStyle = grad2;
  ctx.fillRect(x, y + 3, w, 0.5);
}

          const cx = col * sz * 1.5, cy = row * hh * 2 + (col%2 ? hh : 0);

// ═══════════════════════════════════════════════════════════════
//  CARD DNA
// ═══════════════════════════════════════════════════════════════
function mixHash(h, salt) {
  let m = h ^ salt;
  m = Math.imul(m ^ (m >>> 16), 0x45d9f3b);
  m = Math.imul(m ^ (m >>> 13), 0x45d9f3b);
  return (m ^ (m >>> 16)) >>> 0;
}

class CardDNA {
  constructor(name) {
    this.name = name;
    const h = fnv1a(name);
    this.palette     = mixHash(h, 0x9e3779b9) % PALETTES.length;
    this.border      = mixHash(h, 0x517cc1b7) % BORDERS.length;
    this.pattern     = mixHash(h, 0x6c62272e) % PATTERNS.length;
    this.holo        = mixHash(h, 0x2e1b2138) % HOLOS.length;
    this.patternSeed = mixHash(h, 0x85ebca6b);
    this.borderSeed  = mixHash(h, 0xc2b2ae35);
    this.identiconSeed = h;
    this.starSeed    = mixHash(h, 0x3c6ef372);
    this.constellSeed = mixHash(h, 0x14057b7e);
    const roll = mixHash(h, 0x27d4eb2f) % 100;
    this.rarity = roll < 50 ? 0 : roll < 80 ? 1 : roll < 95 ? 2 : 3;
  }
}

// ═══════════════════════════════════════════════════════════════
//  CARD RENDERING — the main event
// ═══════════════════════════════════════════════════════════════
function renderCard(canvas, name, dna) {
  const ctx = canvas.getContext('2d');
  const w = CW, h = CH;
  const pal = PALETTES[dna.palette];
  const rarity = RARITIES[dna.rarity];
  const certId = generateCertId(name);
  const font = "'PPSupplyMono', 'SF Mono', monospace";
  const L = PAD + 20, R = w - PAD - 20, cw = R - L;

  ctx.clearRect(0, 0, w, h);
  ctx.save();

  // ── Opaque base ──
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, w, h);

  // ── Rounded clip ──
  roundRect(ctx, 0, 0, w, h, 16);
  ctx.clip();

  // ── DIAGONAL GRADIENT BACKGROUND ──
  const bgGrad = ctx.createLinearGradient(0, 0, w, h);
  bgGrad.addColorStop(0, pal.bg);
  bgGrad.addColorStop(0.5, pal.bg2);
  bgGrad.addColorStop(1, pal.bg);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, w, h);

  // ── Ambient glow (multi-color) ──
  const amb1 = ctx.createRadialGradient(w*0.3, h*0.2, 0, w*0.3, h*0.2, h*0.4);
  amb1.addColorStop(0, withAlpha(pal.glow, 0.06));
  amb1.addColorStop(1, 'transparent');
  ctx.fillStyle = amb1;
  ctx.fillRect(0, 0, w, h);
  const amb2 = ctx.createRadialGradient(w*0.7, h*0.7, 0, w*0.7, h*0.7, h*0.4);
  amb2.addColorStop(0, withAlpha(pal.acc2, 0.04));
  amb2.addColorStop(1, 'transparent');
  ctx.fillStyle = amb2;
  ctx.fillRect(0, 0, w, h);

  // ── STAR FIELD ──
  drawStarField(ctx, w, h, dna.starSeed, pal.pri, pal.acc2, rarity.stars);

  // ── Background pattern (more visible) ──
  ctx.globalAlpha = 0.55;
  PATTERNS[dna.pattern].draw(ctx, w, h, pal.bgL, dna.patternSeed, pal);
  ctx.globalAlpha = 1;

  // ── Security holographic strip ──
  drawSecurityStrip(ctx, w, h, pal);

  // ── Border ──
  BORDERS[dna.border].draw(ctx, PAD, PAD, w-PAD*2, h-PAD*2, pal, dna.borderSeed, font);

  // ── CHIP (top-left, like a credit card) ──
  drawChip(ctx, L, PAD + 14, 42, 30, pal.acc, pal.acc2);

  // ═══ HEADER ═══
  const hy = PAD + 20;
  ctx.font = `bold 13px ${font}`;
  ctx.fillStyle = pal.sec;
  ctx.textBaseline = 'top';
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.6;
  ctx.fillText('DEPT. OF MACHINE VERIFICATION', w/2 + 14, hy + 6);
  ctx.globalAlpha = 1;

  // Header gradient divider
  const dv1 = hy + 30;
  drawGradientDivider(ctx, L, dv1, cw, pal.acc, pal.acc2);

  // ═══ AGENT NAME (gradient text, big) ═══
  const ny = dv1 + 22;
  const displayName = name + '.agent';
  let nameSize = 34;
  ctx.font = `bold ${nameSize}px ${font}`;
  while (ctx.measureText(displayName).width > cw && nameSize > 14) {
    nameSize -= 2;
    ctx.font = `bold ${nameSize}px ${font}`;
  }
  // Gradient fill for name text
  const nameGrad = ctx.createLinearGradient(w/2 - 150, ny, w/2 + 150, ny);
  nameGrad.addColorStop(0, pal.pri);
  nameGrad.addColorStop(0.5, pal.acc);
  nameGrad.addColorStop(1, pal.acc2);
  ctx.fillStyle = nameGrad;
  ctx.textAlign = 'center';
  ctx.shadowColor = pal.glow;
  ctx.shadowBlur = rarity.glow + 6;
  ctx.fillText(displayName, w/2, ny);
  // Second pass for intensity
  ctx.globalAlpha = 0.3;
  ctx.fillText(displayName, w/2, ny);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;

  // ── Rarity badge ──
  const rtag = ny + nameSize + 6;
  if (dna.rarity > 0) {
    // Badge background pill
    ctx.font = `bold 10px ${font}`;
    const badgeW = ctx.measureText(rarity.label).width + 16;
    const badgeX = w/2 - badgeW/2;
    roundRect(ctx, badgeX, rtag - 3, badgeW, 16, 8);
    ctx.fillStyle = withAlpha(pal.acc2, 0.15);
    ctx.fill();
    ctx.strokeStyle = withAlpha(pal.acc2, 0.3);
    ctx.lineWidth = 0.5;
    roundRect(ctx, badgeX, rtag - 3, badgeW, 16, 8);
    ctx.stroke();
    // Badge text
    ctx.fillStyle = pal.acc2;
    ctx.textAlign = 'center';
    ctx.shadowColor = pal.acc2;
    ctx.shadowBlur = rarity.glow * 0.4;
    ctx.fillText(rarity.label, w/2, rtag);
    ctx.shadowBlur = 0;
  }

  // ── Thin divider ──
  const dv2 = rtag + 18;
  ctx.fillStyle = pal.dim;
  ctx.globalAlpha = 0.4;
  ctx.fillRect(L + 50, dv2, cw - 100, 0.5);
  ctx.globalAlpha = 1;

  // ═══ IDENTICON with constellation behind ═══
  const icoS = 195, icoX = (w - icoS) / 2, icoY = dv2 + 12;

  // Constellation behind identicon
  drawConstellation(ctx, icoX - 30, icoY - 20, icoS + 60, icoS + 40, dna.constellSeed, pal.acc);

  // Identicon glow
  const icoGlow = ctx.createRadialGradient(w/2, icoY+icoS/2, icoS*0.15, w/2, icoY+icoS/2, icoS*0.7);
  icoGlow.addColorStop(0, withAlpha(pal.glow, 0.08));
  icoGlow.addColorStop(0.5, withAlpha(pal.acc2, 0.03));
  icoGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = icoGlow;
  ctx.fillRect(icoX - 50, icoY - 50, icoS + 100, icoS + 100);

  // Frame — double border with accent corners
  ctx.strokeStyle = pal.dim; ctx.lineWidth = 1;
  ctx.strokeRect(icoX - 4, icoY - 4, icoS + 8, icoS + 8);
  ctx.strokeStyle = withAlpha(pal.acc2, 0.3); ctx.lineWidth = 0.5;
  ctx.strokeRect(icoX - 7, icoY - 7, icoS + 14, icoS + 14);
  drawCorners(ctx, icoX - 9, icoY - 9, icoS + 18, icoS + 18, pal.acc, 20);
  // Corner diamonds in acc2
  const dSize = 3;
  [[icoX-9, icoY-9],[icoX+icoS+9, icoY-9],[icoX-9, icoY+icoS+9],[icoX+icoS+9, icoY+icoS+9]].forEach(([cx,cy]) => {
    ctx.fillStyle = pal.acc2;
    ctx.beginPath();
    ctx.moveTo(cx, cy-dSize); ctx.lineTo(cx+dSize, cy);
    ctx.lineTo(cx, cy+dSize); ctx.lineTo(cx-dSize, cy);
    ctx.closePath(); ctx.fill();
  });

  // Draw the identicon with dual colors
  drawIdenticon(ctx, icoX, icoY, icoS, dna.identiconSeed, pal.pri, pal.acc2);

  // ═══ CERTIFICATE ID + BARCODE ═══
  const cy = icoY + icoS + 20;
  ctx.textAlign = 'left';
  ctx.font = `10px ${font}`;
  ctx.fillStyle = pal.dim;
  ctx.fillText('CERTIFICATE ID', L, cy);
  ctx.font = `bold 19px ${font}`;
  ctx.fillStyle = pal.sec;
  ctx.shadowColor = pal.glow;
  ctx.shadowBlur = 2;
  ctx.fillText(certId, L, cy + 18);
  ctx.shadowBlur = 0;

  // Barcode under cert ID
  drawBarcode(ctx, L, cy + 38, cw * 0.65, 8, fnv1a(certId + ':bar'), pal.pri);

  // ═══ TYPE + STATUS ═══
  const ty = cy + 56;
  ctx.font = `10px ${font}`;
  ctx.fillStyle = pal.dim;
  ctx.fillText('TYPE', L, ty);
  ctx.fillText('STATUS', w/2 + 10, ty);
  ctx.font = `bold 13px ${font}`;
  ctx.fillStyle = pal.sec;
  ctx.fillText('INDIVIDUAL', L, ty + 15);
  ctx.fillStyle = pal.acc;
  ctx.fillText('\u25CF VERIFIED', w/2 + 10, ty + 15);

  // Gradient divider
  const dv3 = ty + 38;
  drawGradientDivider(ctx, L, dv3, cw, pal.dim, pal.acc2);

  // ═══ METADATA ═══
  const my = dv3 + 13;
  ctx.font = `9px ${font}`;
  ctx.fillStyle = pal.dim;
  ctx.fillText('ISSUED', L, my);
  ctx.fillText('EXPIRES', L + 160, my);
  ctx.fillText('PROTOCOL', L + 310, my);
  ctx.font = `12px ${font}`;
  ctx.fillStyle = pal.sec;
  const now = new Date();
  ctx.fillText(`${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`, L, my + 14);
  ctx.fillText('NEVER', L + 160, my + 14);
  ctx.fillStyle = pal.acc;
  ctx.fillText('v1.0', L + 310, my + 14);

  // Security microtext
  drawMicroText(ctx, L, my + 30, cw, 'DMV-VERIFIED-AGENT-REGISTRY-AUTHENTIC ', pal.dim);

  // Gradient divider
  const dv4 = my + 36;
  drawGradientDivider(ctx, L, dv4, cw, pal.acc, pal.dim);

  // ═══ QR + REGISTRY INFO + RARITY SEAL ═══
  const qy = dv4 + 12;
  const qs = 115;
  drawQR(ctx, L, qy, qs, fnv1a(certId), pal.pri);

  // Registry info
  const qx = L + qs + 18;
  ctx.font = `9px ${font}`;
  ctx.fillStyle = pal.dim;
  ctx.fillText('REGISTRY', qx, qy + 8);
  ctx.font = `11px ${font}`;
  ctx.fillStyle = pal.sec;
  ctx.fillText('agentcommunity', qx, qy + 22);
  ctx.fillStyle = pal.acc;
  ctx.fillText('.org', qx + ctx.measureText('agentcommunity').width, qy + 22);

  ctx.font = `9px ${font}`;
  ctx.fillStyle = pal.dim;
  ctx.fillText('NETWORK', qx, qy + 42);
  ctx.font = `11px ${font}`;
  ctx.fillStyle = pal.acc2;
  ctx.fillText('.agent TLD', qx, qy + 56);

  // Rarity seal — circular emblem
  const sealX = qx + 75, sealY = qy + qs - 22;
  // Triple ring seal
  [26, 22, 18].forEach((r, i) => {
    ctx.strokeStyle = i === 1 ? pal.acc2 : pal.acc;
    ctx.globalAlpha = 0.15 + i * 0.1;
    ctx.lineWidth = i === 0 ? 0.5 : 1;
    ctx.beginPath();
    ctx.arc(sealX, sealY, r, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  if (dna.rarity > 0) {
    ctx.font = `bold 20px ${font}`;
    ctx.fillStyle = pal.acc2;
    ctx.shadowColor = pal.acc2;
    ctx.shadowBlur = rarity.glow * 0.6;
    ctx.fillText(rarity.sym, sealX, sealY - 3);
    ctx.shadowBlur = 0;
    ctx.font = `6px ${font}`;
    ctx.fillStyle = pal.dim;
    ctx.fillText(rarity.name, sealX, sealY + 13);
  } else {
    ctx.font = `9px ${font}`;
    ctx.fillStyle = pal.dim;
    ctx.fillText('STD', sealX, sealY + 3);
  }
  ctx.textAlign = 'left';

  // ═══ BOTTOM ═══
  const bot = h - PAD - 34;
  drawGradientDivider(ctx, L, bot, cw, pal.acc2, pal.acc);

  // Bottom barcode strip
  drawBarcode(ctx, L, bot + 8, cw, 5, fnv1a(name + ':bottom'), pal.dim);

  // Footer
  ctx.font = `10px ${font}`;
  ctx.fillStyle = pal.dim;
  ctx.textAlign = 'center';
  ctx.fillText('dmv.agentcommunity.org', w/2, bot + 20);
  ctx.textAlign = 'left';

  // ═══ SCANLINES ═══
  ctx.fillStyle = 'rgba(0,0,0,0.03)';
  for (let sy = 0; sy < h; sy += 3) ctx.fillRect(0, sy, w, 1);

  // ═══ VIGNETTE ═══
  const vig = ctx.createRadialGradient(w/2, h/2, h*0.35, w/2, h/2, h*0.7);
  vig.addColorStop(0, 'transparent');
  vig.addColorStop(1, 'rgba(0,0,0,0.18)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, w, h);

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════
const state = { name: 'nexus-7', overrides: {} };

function getEffectiveDNA() {
  const dna = new CardDNA(state.name);
  return {
    palette:      state.overrides.palette ?? dna.palette,
    border:       state.overrides.border ?? dna.border,
    pattern:      state.overrides.pattern ?? dna.pattern,
    holo:         state.overrides.holo ?? dna.holo,
    rarity:       state.overrides.rarity ?? dna.rarity,
    patternSeed:  dna.patternSeed,
    borderSeed:   dna.borderSeed,
    identiconSeed:dna.identiconSeed,
    starSeed:     dna.starSeed,
    constellSeed: dna.constellSeed,
    name:         dna.name,
  };
}

// ═══════════════════════════════════════════════════════════════
//  HOLO & INTERACTION — light-reactive (pokemon-cards-css style)
// ═══════════════════════════════════════════════════════════════
function applyHoloType(cardEl, dna) {
  cardEl.classList.remove('holo-rainbow','holo-prism','holo-aurora','holo-duochrome');
  const holoId = HOLOS[dna.holo].id;
  if (holoId !== 'rainbow') cardEl.classList.add('holo-' + holoId);
  cardEl.style.setProperty('--holo-intensity', RARITIES[dna.rarity].intensity);
  if (holoId === 'duochrome') {
    const pal = PALETTES[dna.palette];
    cardEl.style.setProperty('--duo-1', withAlpha(pal.pri, 0.5));
    cardEl.style.setProperty('--duo-2', withAlpha(pal.acc, 0.5));
  }
  const pal = PALETTES[dna.palette];
  cardEl.closest('.card-wrap, .gallery-item')
    ?.style.setProperty('--card-glow', withAlpha(pal.glow, 0.1));
}

// Track which cards are being interacted with
const interactingCards = new WeakSet();

// Spring-like values per card for smooth interpolation
const cardSprings = new WeakMap();

function getSpring(cardEl) {
  if (!cardSprings.has(cardEl)) {
    cardSprings.set(cardEl, {
      // Current smoothed values
      mx: 50, my: 50, angle: 130,
      bgX: 50, bgY: 50,
      rotX: 0, rotY: 0,
      opacity: 0,
      // Target values (set by pointer)
      targetMx: 50, targetMy: 50, targetAngle: 130,
      targetBgX: 50, targetBgY: 50,
      targetRotX: 0, targetRotY: 0,
      targetOpacity: 0,
    });
  }
  return cardSprings.get(cardEl);
}

function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

function applyTilt(cardEl, clientX, clientY) {
  const rect = cardEl.getBoundingClientRect();
  const px = clamp((clientX - rect.left) / rect.width, 0, 1);   // 0..1
  const py = clamp((clientY - rect.top) / rect.height, 0, 1);   // 0..1

  // 3D tilt: ±20 degrees
  const rotY = (px - 0.5) * 40;
  const rotX = (py - 0.5) * -40;

  // Angle of light from center
  const angle = Math.atan2(py - 0.5, px - 0.5) * (180 / Math.PI) + 90;

  // Background position: narrow range for subtle parallax (37-63%)
  const bgX = 37 + (px * 26);
  const bgY = 33 + (py * 34);

  const spring = getSpring(cardEl);
  spring.targetMx = px * 100;
  spring.targetMy = py * 100;
  spring.targetAngle = angle;
  spring.targetBgX = bgX;
  spring.targetBgY = bgY;
  spring.targetRotX = rotX;
  spring.targetRotY = rotY;
  spring.targetOpacity = 1;
}

function resetCardSpring(cardEl) {
  const spring = getSpring(cardEl);
  spring.targetMx = 50;
  spring.targetMy = 50;
  spring.targetAngle = 130;
  spring.targetBgX = 50;
  spring.targetBgY = 50;
  spring.targetRotX = 0;
  spring.targetRotY = 0;
  spring.targetOpacity = 0;  // holo fades out when not interacting
}

function setupCardHover(cardEl) {
  getSpring(cardEl); // init

  // Mouse
  cardEl.addEventListener('mouseenter', () => {
    interactingCards.add(cardEl);
  });
  cardEl.addEventListener('mousemove', (e) => {
    interactingCards.add(cardEl);
    applyTilt(cardEl, e.clientX, e.clientY);
  });
  cardEl.addEventListener('mouseleave', () => {
    interactingCards.delete(cardEl);
    resetCardSpring(cardEl);
  });
  // Touch
  cardEl.addEventListener('touchstart', (e) => {
    interactingCards.add(cardEl);
    const t = e.touches[0];
    applyTilt(cardEl, t.clientX, t.clientY);
  }, { passive: true });
  cardEl.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    applyTilt(cardEl, t.clientX, t.clientY);
  }, { passive: false });
  cardEl.addEventListener('touchend', () => {
    interactingCards.delete(cardEl);
    resetCardSpring(cardEl);
  });
}

// ═══════════════════════════════════════════════════════════════
//  ANIMATION LOOP — spring interpolation + idle sway
// ═══════════════════════════════════════════════════════════════
const allCards = [];

function animateHolo() {
  const t = performance.now() * 0.001;

  for (let i = 0; i < allCards.length; i++) {
    const cardEl = allCards[i];
    const spring = getSpring(cardEl);
    const isActive = interactingCards.has(cardEl);

    // Idle sway: very subtle when not interacting
    if (!isActive) {
      const offset = i * 1.7;
      // Gentle idle: barely perceptible movement
      spring.targetRotX = Math.sin((t + offset) * 0.3) * 1.5;
      spring.targetRotY = Math.cos((t + offset) * 0.25) * 2;
      // Subtle bg drift
      spring.targetBgX = 50 + Math.sin((t + offset) * 0.2) * 3;
      spring.targetBgY = 50 + Math.cos((t + offset) * 0.15) * 3;
      spring.targetAngle = 130 + Math.sin((t + offset) * 0.1) * 10;
    }

    // Spring interpolation (lerp toward targets)
    const lerpRate = isActive ? 0.15 : 0.04;
    spring.mx += (spring.targetMx - spring.mx) * lerpRate;
    spring.my += (spring.targetMy - spring.my) * lerpRate;
    spring.angle += (spring.targetAngle - spring.angle) * lerpRate;
    spring.bgX += (spring.targetBgX - spring.bgX) * lerpRate;
    spring.bgY += (spring.targetBgY - spring.bgY) * lerpRate;
    spring.rotX += (spring.targetRotX - spring.rotX) * lerpRate;
    spring.rotY += (spring.targetRotY - spring.rotY) * lerpRate;
    spring.opacity += (spring.targetOpacity - spring.opacity) * (isActive ? 0.12 : 0.06);

    // Derived values
    const pointerFromCenter = clamp(
      Math.sqrt(Math.pow((spring.mx - 50) / 50, 2) + Math.pow((spring.my - 50) / 50, 2)),
      0, 1
    );
    const pointerFromLeft = spring.mx / 100;
    const pointerFromTop = spring.my / 100;

    // Apply to DOM
    cardEl.style.transform = `rotateX(${spring.rotX.toFixed(2)}deg) rotateY(${spring.rotY.toFixed(2)}deg)`;
    cardEl.style.setProperty('--mx', spring.mx.toFixed(1) + '%');
    cardEl.style.setProperty('--my', spring.my.toFixed(1) + '%');
    cardEl.style.setProperty('--angle', spring.angle.toFixed(1) + 'deg');
    cardEl.style.setProperty('--bg-x', spring.bgX.toFixed(1) + '%');
    cardEl.style.setProperty('--bg-y', spring.bgY.toFixed(1) + '%');
    cardEl.style.setProperty('--card-opacity', spring.opacity.toFixed(3));
    cardEl.style.setProperty('--pointer-from-center', pointerFromCenter.toFixed(3));
    cardEl.style.setProperty('--pointer-from-left', pointerFromLeft.toFixed(3));
    cardEl.style.setProperty('--pointer-from-top', pointerFromTop.toFixed(3));
  }

  requestAnimationFrame(animateHolo);
}

// ═══════════════════════════════════════════════════════════════
//  UI: CONTROLS
// ═══════════════════════════════════════════════════════════════
function setupControls() {
  const nameInput = document.getElementById('nameInput');
  const mainCard = document.getElementById('mainCard');
  allCards.push(mainCard);

  const palSel = document.getElementById('palSel');
  PALETTES.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'pal-btn';
    // Show dual-color swatch
    btn.style.background = `linear-gradient(135deg, ${p.pri} 50%, ${p.acc2} 50%)`;
    btn.title = p.name;
    btn.onclick = () => { state.overrides.palette = i; updateMain(); };
    palSel.appendChild(btn);
  });

  const makeOpts = (containerId, items, key) => {
    const el = document.getElementById(containerId);
    items.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.textContent = item.name;
      btn.onclick = () => { state.overrides[key] = i; updateMain(); };
      el.appendChild(btn);
    });
  };
  makeOpts('borderSel', BORDERS, 'border');
  makeOpts('patternSel', PATTERNS, 'pattern');
  makeOpts('holoSel', HOLOS, 'holo');
  makeOpts('raritySel', RARITIES.map(r => ({ name: r.name })), 'rarity');

  let debounce;
  nameInput.addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      state.name = nameInput.value.trim() || 'agent';
      state.overrides = {};
      updateMain();
    }, 200);
  });

  document.getElementById('btnRandName').onclick = () => {
    state.name = AGENT_NAMES[(Math.random() * AGENT_NAMES.length) | 0];
    nameInput.value = state.name;
    state.overrides = {};
    mainCard.classList.add('flipping');
    setTimeout(() => updateMain(), 200);
    setTimeout(() => mainCard.classList.remove('flipping'), 500);
  };

  document.getElementById('btnRandomize').onclick = () => {
    state.name = AGENT_NAMES[(Math.random() * AGENT_NAMES.length) | 0];
    nameInput.value = state.name;
    state.overrides = {};
    mainCard.classList.add('flipping');
    setTimeout(() => updateMain(), 200);
    setTimeout(() => mainCard.classList.remove('flipping'), 500);
  };

  setupCardHover(mainCard);
}

function updateMain() {
  const dna = getEffectiveDNA();
  const canvas = document.getElementById('mainCanvas');
  const card = document.getElementById('mainCard');
  renderCard(canvas, state.name, dna);
  applyHoloType(card, dna);
  updateHighlights(dna);
  updateReadout(dna);
}

function updateHighlights(dna) {
  document.querySelectorAll('#palSel .pal-btn').forEach((b,i) => b.classList.toggle('active', i===dna.palette));
  document.querySelectorAll('#borderSel .opt-btn').forEach((b,i) => b.classList.toggle('active', i===dna.border));
  document.querySelectorAll('#patternSel .opt-btn').forEach((b,i) => b.classList.toggle('active', i===dna.pattern));
  document.querySelectorAll('#holoSel .opt-btn').forEach((b,i) => b.classList.toggle('active', i===dna.holo));
  document.querySelectorAll('#raritySel .opt-btn').forEach((b,i) => b.classList.toggle('active', i===dna.rarity));
}

function updateReadout(dna) {
  const el = document.getElementById('dnaReadout');
  el.innerHTML = [
    `Palette: <span>${PALETTES[dna.palette].name}</span>`,
    `Border: <span>${BORDERS[dna.border].name}</span>`,
    `Pattern: <span>${PATTERNS[dna.pattern].name}</span>`,
    `Holo: <span>${HOLOS[dna.holo].name}</span>`,
    `Rarity: <span>${RARITIES[dna.rarity].label}</span>`,
    `Combos: <span>2,048+</span>`,
  ].join('<br>');
}

// ═══════════════════════════════════════════════════════════════
//  GALLERY
// ═══════════════════════════════════════════════════════════════
function setupGallery() {
  const grid = document.getElementById('galleryGrid');
  const names = ['nova','pulse','ghost','atlas','phantom','drift','flux','frost'];
  names.forEach(name => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.style.perspective = '600px';

    const card = document.createElement('div');
    card.className = 'card gallery-card';

    const canvas = document.createElement('canvas');
    canvas.width = CW; canvas.height = CH;
    card.appendChild(canvas);

    ['card-shine','card-glare','card-foil','card-sparkle'].forEach(cls => {
      const div = document.createElement('div');
      div.className = cls;
      card.appendChild(div);
    });

    item.appendChild(card);

    const label = document.createElement('div');
    label.className = 'gallery-label';
    label.textContent = name + '.agent';
    item.appendChild(label);

    grid.appendChild(item);

    const dna = new CardDNA(name);
    renderCard(canvas, name, dna);
    applyHoloType(card, dna);
    setupCardHover(card);
    allCards.push(card);

    card.addEventListener('click', () => {
      state.name = name;
      state.overrides = {};
      document.getElementById('nameInput').value = name;
      updateMain();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });
}

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
async function init() {
  try { await document.fonts.load('16px PPSupplyMono'); } catch(e) {}
  setupControls();
  updateMain();
  setupGallery();
  requestAnimationFrame(animateHolo);
}
init();
</script>
